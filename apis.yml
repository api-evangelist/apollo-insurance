- aid: apollo-insurance:apollo-covertrack-api
  name: APOLLO CoverTrack API
  description: >-
    CoverTrack is APOLLO's tenant-insurance compliance product for REITs and property
    managers, served from its own api.covertrack.ca host. Three real operations plus one
    documented callback — read a single tenant's compliance status (ACTIVE, PENDING,
    NOT_SUBMITTED or DECLINED, with optional policy detail including the third-party
    carrier's policy number and provider), read compliance status for every tenant of a
    property, and generate a tenant insurance quote for a partner. The fourth path is an
    example specification of a partner destination callback that APOLLO POSTs when a
    relevant policy event occurs — the only event-driven surface APOLLO documents.
  humanURL: https://docs.apollocover.com/docs/covertrack-api/fu18p9wlkzenb-cover-track-api-s
  baseURL: https://api.covertrack.ca
  tags:
  - Insurance
  - Compliance
