- aid: apollo-insurance:apollo-public-api-affiliates
  name: APOLLO Public API - Affiliates
  description: >-
    The earlier APOLLO public affiliate surface, still published in its own Stoplight
    project. Two POST operations fixed to the tenant line — generate a quote (returning
    contents, ALE, liability and add-on premium components with a policy expiry date) and
    create an application. Same AWS ca-central-1 test and production hosts as the current
    Affiliates API; the project also carries a Webhooks page, which is present but empty.
  humanURL: https://docs.apollocover.com/docs/affiliate-api/18a87d4863056-public-api-affiliates
