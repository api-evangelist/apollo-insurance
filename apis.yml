apis:
- aid: apollo-insurance:apollo-affiliates-api
  name: APOLLO Affiliates API
  description: >-
    The current APOLLO Affiliate API. Two partner-scoped POST operations — quote an
    application and create an application — scoped by affiliateId (the partner's
    co-branded APOLLO subdomain) and insuranceType (currently only `tenant`). Creating an
    application returns a quoteLink into the affiliate's co-branded APOLLO launchpad with
    the customer's responses pre-filled. Authenticated with an x-api-key header token
    issued by an APOLLO contact; separate tokens for the test and production servers, plus
    a Stoplight mock server for prototyping.
  humanURL: https://docs.apollocover.com/docs/public-affiliate-api/a8a7ea17b0889-affiliates-api
  baseURL: https://fpl95knwc1.execute-api.ca-central-1.amazonaws.com/1_0_0
