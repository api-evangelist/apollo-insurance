name: APOLLO Insurance
kind: company
description: >-
  APOLLO Insurance (APOLLO Insurance Agency Ltd., apollocover.com) is a Vancouver-founded
  Canadian digital insurance brokerage and MGA-style distribution platform that sells
  personal and small-commercial coverage entirely online — tenant and student tenant
  insurance in every province, homeowner, condo and townhouse, landlord and pet insurance
  on the personal side, and general liability, professional liability and directors and
  officers coverage on the business side. APOLLO does not underwrite; it distributes on a
  commission basis on behalf of A+ to A- rated Canadian carriers, and it sits in the thin
  digital-broker layer of a Big-Few Canadian market dominated by Intact, Definity,
  Co-operators and Desjardins. Its distinctive business is embedded tenant insurance for
  REITs and property managers: automated resident enrolment at lease signing, renewal
  handling, and real-time building-level compliance tracking, delivered through a Yardi
  Systems integration and its CoverTrack compliance product. Unusually for the Canadian
  insurance sector, APOLLO publishes a genuine, publicly readable developer portal at
  docs.apollocover.com — a Stoplight workspace with three public projects and downloadable
  OpenAPI definitions covering quote and application (pre-fill) for tenant insurance and
  compliance-status lookup for partner properties. The surface is real but partner-scoped:
  every call needs an affiliateId (a co-branded APOLLO subdomain) and an x-api-key token
  that APOLLO issues by hand to affiliates and property-manager partners, so there is no
  self-serve credential path and no consumer-facing API. Canada has no open-insurance
  mandate — OSFI supervises prudentially, the provinces (FSRA, AMF) supervise market
  conduct, and Consumer-Driven Banking excludes insurance entirely — so nothing forces
  this disclosure; APOLLO published it as a distribution strategy. No ACORD, AL3, IVANS or
  agency-management-system reference appears anywhere in its public site or documentation.
