source: >-
  openapi/apollo-insurance-affiliates.yml (components.schemas + request/response bodies),
  openapi/apollo-insurance-covertrack.yml (components.schemas), and the path parameters of
  openapi/apollo-insurance-affiliates-legacy.yml
summary: >-
  APOLLO's public data model is two disconnected islands. The Affiliates island is a
  quote/application funnel: a flat tenant question set in, a priced quote or a hosted
  application link out. The CoverTrack island is a compliance ledger keyed on a
  partner/property/tenant triple. Nothing joins them — no shared identifier, no policy entity,
  no customer entity, no claim entity. There is no ISSUE and no FNOL surface, so the model
  stops at the moment the consumer is handed to the hosted launchpad.

id_conventions:
  note: All identifiers are opaque strings supplied by the partner or by APOLLO; no prefixed id scheme is published.
  documented:
  - {id: affiliateId, meaning: the partner's co-branded APOLLO subdomain, issued_by: APOLLO}
  - {id: partnerId, meaning: the partner name, issued_by: APOLLO}
  - {id: propertyId, meaning: property ID / "P-Code"; the Yardi property code in embedded flows, example: P12345678}
  - {id: tenantId, meaning: tenant ID / "T-Code"; the Yardi tcode / residentId in embedded flows, example: T12345678}
  - {id: externalId, meaning: the partner's own unique client ID, issued_by: partner, purpose: duplicate-application prevention}
  - {id: quote, meaning: opaque UUID carried on the returned quoteLink query string, example: 6fa455a8-8b11-4a6e-b7fa-80619f7d66e7}

