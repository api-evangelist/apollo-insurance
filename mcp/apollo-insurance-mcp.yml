  reason: Not a callable endpoint. The spec states plainly "this is not an actual endpoint, just the specification
    for the callback" — it documents the payload APOLLO POSTs to a partner destination. Captured in asyncapi/apollo-insurance-covertrack-webhooks.yml
    instead.
- operations:
