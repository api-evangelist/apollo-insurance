privacy_note: Every request body on the affiliate surface carries personal information — name, birthdate,
  email, phone, home address and contents limits. Any MCP deployment fronting this API is moving Canadian
  consumer PII and should bind consent and audit before an agent is allowed to call create_tenant_application.
