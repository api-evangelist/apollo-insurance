server:
  name: apollo-insurance
  transport: http
  url: null
  status: candidate
  auth:
    type: apiKey
    parameter: x-api-key
    location: header
    note: Partner-scoped and hand-issued. An MCP server fronting this API needs a per-affiliate (or per-partner)
      key, plus the affiliateId / partnerId bound at server configuration time rather than passed by the
      model, since they scope every call.
tools:
- name: quote_tenant_application
  description: Price a tenant insurance application for an affiliate without creating anything.
  source_operation: openapi/apollo-insurance-affiliates.yml#public-api-affiliates-quote-post
  input_from: parameters (affiliateId, insuranceType) + requestBody (insuranceData)
  side_effects: none
  consequence: read-like (POST for payload size only)
- name: create_tenant_application
  description: Create a pre-filled application and return a quoteLink into the affiliate's co-branded
    APOLLO launchpad. Does not bind a policy — the consumer completes purchase on the launchpad.
  source_operation: openapi/apollo-insurance-affiliates.yml#public-api-affiliates-application-post
  input_from: parameters (affiliateId, insuranceType) + requestBody (insuranceData | embeddedOptions,
    paymentPeriod, externalId, leadSource)
  side_effects: creates a customer-facing application record
  consequence: write
  dedupe: pass the partner's own externalId to prevent duplicate applications
  human_in_the_loop: recommended — this produces a link a real consumer will be sent
- name: get_tenant_compliance_status
  description: Read one tenant's current tenant-insurance compliance status at a property.
  source_operation: openapi/apollo-insurance-covertrack.yml#get-compliance-status
  input_from: parameters (partnerId, propertyId, tenantId)
  side_effects: none
  consequence: read
  returns: status enum ACTIVE | PENDING | NOT_SUBMITTED | DECLINED, plus optional third-party policy detail
- name: list_property_compliance
  description: Read compliance status for every tenant of a property.
  source_operation: openapi/apollo-insurance-covertrack.yml#get-compliance-partnerId-propertyId
  input_from: parameters (partnerId, propertyId)
  side_effects: none
  consequence: read
  caveat: unbounded array — no pagination, so large properties return whole
- name: quote_covertrack_tenant
  description: Generate a tenant insurance quote for a CoverTrack partner property/tenant.
  source_operation: openapi/apollo-insurance-covertrack.yml#post-quote-tenant-partnerId
  input_from: parameters (partnerId) + requestBody (propertyId, tenantId, contents, ale, liability, deductible,
    water)
  side_effects: none
  consequence: read-like (POST for payload size only)
