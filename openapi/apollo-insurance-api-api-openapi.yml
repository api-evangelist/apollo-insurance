          example: 5000
        totalSemesters:
          type: string
          enum:
          - 12 months
          description: How long would you like to purchase this policy for - should always be 12 months
          example: 12 months
          default: 12 months
      required:
      - businessAddressPostal
      - businessAddressCity
      - operations
      - businessAddressStreet
