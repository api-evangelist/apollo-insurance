findings:
  note: >-
    Recorded observations, not assertions of risk. Added api.covertrack.ca and the covertrack.ca
    registrable domain in this round — the mechanical probe covered only the apis.yml hosts and
    the first spec's servers.
  observations:
  - No HSTS on apollocover.com or api.covertrack.ca; present only on docs.apollocover.com (max-age 31536000).
    APOLLO's own security page states "we leverage browser protections such as HTTP Strict
    Transport Protection", which holds for the docs host but not the primary website or the
    CoverTrack API host.
  - No CAA records on either apollocover.com or covertrack.ca — any CA may issue for these names.
  - No DNSSEC on either registrable domain.
  - DMARC is published on both apollocover.com and covertrack.ca but at 'p=none' — monitoring
    only, no enforcement against spoofed mail. For a broker that emails policy documents to
    consumers this is the weakest published control.
  - TLS 1.3 observed on every host, above the TLS 1.2 minimum APOLLO publishes.
